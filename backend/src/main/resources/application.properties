spring.application.name=A3StudentName_ClassCode
server.port=8080
spring.profiles.default=sqlserver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Staff is configured here, not stored in the Customer table.
app.staff.email=${STAFF_EMAIL:staff@fuminihotel.com}
app.staff.password=${STAFF_PASSWORD:Staff@123}
app.jwt.secret=${JWT_SECRET:local-assignment-secret-at-least-32-characters-long}
app.jwt.expiration-seconds=7200
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.seed-data=true
